name: Reusable Java container CI

on:
  workflow_call:
    inputs:
      java_version:
        type: string
        default: "21"
      build_command:
        type: string
        default: mvn -B -ntp test
      image_name:
        type: string
        required: true
      dockerfile:
        type: string
        default: Dockerfile
      publish_image:
        type: boolean
        default: false
      registry:
        type: string
        default: ghcr.io
    secrets:
      registry_username:
        required: false
      registry_password:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Run build and tests
        run: ${{ inputs.build_command }}

      - name: Validate publish configuration
        if: ${{ inputs.publish_image }}
        shell: bash
        run: |
          test -n "${{ inputs.registry }}" || { echo "registry is required when publish_image=true" >&2; exit 1; }

      - name: Log in to container registry
        if: ${{ inputs.publish_image && inputs.registry == 'ghcr.io' && github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to external container registry
        if: ${{ inputs.publish_image && inputs.registry != '' && inputs.registry != 'ghcr.io' && github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.publish_image && inputs.registry != '' && github.event_name != 'pull_request' }}
          tags: |
            ${{ inputs.image_name }}:${{ github.sha }}
            ${{ inputs.image_name }}:latest
