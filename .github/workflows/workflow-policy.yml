name: Workflow policy
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl --fail --silent --show-error --location --output checksums.txt https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          expected=$(awk '$2 == "actionlint_1.7.12_linux_amd64.tar.gz" {print $1}' checksums.txt)
          test "${#expected}" -eq 64
          printf '%s  actionlint.tar.gz\n' "$expected" | sha256sum --check -
          tar -xzf actionlint.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
