name: Reusable Java container CI

on:
  workflow_call:
    outputs:
      digest:
        description: Published immutable image digest
        value: ${{ jobs.container.outputs.digest }}
    inputs:
      java_version:
        type: string
        default: "21"
      build_command:
        type: string
        default: mvn -B -ntp test
      image_name:
        type: string
        required: true
      dockerfile:
        type: string
        default: Dockerfile
      publish_image:
        type: boolean
        default: false
      registry:
        type: string
        default: ghcr.io
    secrets:
      registry_username:
        required: false
      registry_password:
        required: false

permissions:
  contents: read

jobs:
  source-security:
    uses: ./.github/workflows/security-scan.yml

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Run build and tests
        run: ${{ inputs.build_command }}

  image-security:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: false
          platforms: linux/amd64
          outputs: type=oci,dest=/tmp/platform-image.tar
          sbom: true
          provenance: mode=min
          tags: ${{ inputs.image_name }}:${{ github.sha }}
      - name: Extract OCI layout for scanning
        run: mkdir /tmp/platform-image && tar -xf /tmp/platform-image.tar -C /tmp/platform-image
      - name: Scan final image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/platform-image
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true
      - name: Preserve scanned OCI image and attestations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanned-image-java-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/platform-image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  container:
    if: ${{ inputs.publish_image && github.event_name != 'pull_request' }}
    needs: [verify, source-security, image-security]
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the scanned OCI image
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: scanned-image-java-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/scanned-image

      - name: Install registry copy tool
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo

      - name: Validate publish configuration
        if: ${{ inputs.publish_image }}
        shell: bash
        env:
          TARGET_REGISTRY: ${{ inputs.registry }}
          TARGET_IMAGE: ${{ inputs.image_name }}
        run: |
          test -n "$TARGET_REGISTRY"
          case "$TARGET_IMAGE" in "$TARGET_REGISTRY"/*) ;; *) echo 'image must be within configured registry' >&2; exit 1 ;; esac

      - name: Log in to container registry
        if: ${{ inputs.publish_image && inputs.registry == 'ghcr.io' && github.event_name != 'pull_request' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to external container registry
        if: ${{ inputs.publish_image && inputs.registry != '' && inputs.registry != 'ghcr.io' && github.event_name != 'pull_request' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Publish the exact scanned image with attestations
        id: image
        env:
          TARGET_IMAGE: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" --digestfile /tmp/published-digest oci-archive:/tmp/scanned-image/platform-image.tar "docker://$TARGET_IMAGE:$GITHUB_SHA"
          digest=$(cat /tmp/published-digest)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
