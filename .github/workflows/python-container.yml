name: Reusable Python container CI

on:
  workflow_call:
    outputs:
      digest:
        description: Published immutable image digest
        value: ${{ jobs.container.outputs.digest }}
    inputs:
      python_version:
        type: string
        default: "3.11"
      install_command:
        type: string
        default: python -m pip install -e '.[dev]'
      test_command:
        type: string
        default: python -m pytest -q
      image_name:
        type: string
        required: true
      dockerfile:
        type: string
        default: Dockerfile
      publish_image:
        type: boolean
        default: false
      registry:
        type: string
        default: ghcr.io
    secrets:
      registry_username:
        required: false
      registry_password:
        required: false

permissions:
  contents: read

jobs:
  source-security:
    uses: ./.github/workflows/security-scan.yml

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: Install dependencies
        run: ${{ inputs.install_command }}

      - name: Run tests
        run: ${{ inputs.test_command }}

  image-security:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: false
          platforms: linux/amd64
          outputs: type=oci,dest=/tmp/platform-image.tar
          sbom: true
          provenance: mode=min
          tags: ${{ inputs.image_name }}:${{ github.sha }}
      - name: Extract OCI layout for scanning
        run: mkdir /tmp/platform-image && tar -xf /tmp/platform-image.tar -C /tmp/platform-image
      - name: Scan final image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/platform-image
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true
      - name: Preserve scanned OCI image and attestations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanned-image-python-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/platform-image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  container:
    if: ${{ inputs.publish_image && github.event_name != 'pull_request' }}
    needs: [verify, source-security, image-security]
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the scanned OCI image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scanned-image-python-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/scanned-image

      - name: Install registry copy tool
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo

      - name: Validate publish configuration
        if: ${{ inputs.publish_image }}
        shell: bash
        env:
          TARGET_REGISTRY: ${{ inputs.registry }}
          TARGET_IMAGE: ${{ inputs.image_name }}
        run: |
          test -n "$TARGET_REGISTRY"
          case "$TARGET_IMAGE" in "$TARGET_REGISTRY"/*) ;; *) echo 'image must be within configured registry' >&2; exit 1 ;; esac

      - name: Log in to container registry
        if: ${{ inputs.publish_image && inputs.registry == 'ghcr.io' && github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to external container registry
        if: ${{ inputs.publish_image && inputs.registry != '' && inputs.registry != 'ghcr.io' && github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      - name: Publish the exact scanned image with attestations
        id: image
        env:
          TARGET_IMAGE: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" --digestfile /tmp/published-digest oci-archive:/tmp/scanned-image/platform-image.tar "docker://$TARGET_IMAGE:$GITHUB_SHA"
          digest=$(cat /tmp/published-digest)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
