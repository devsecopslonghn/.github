name: Reusable Helm validation

on:
  workflow_call:
    inputs:
      chart_path:
        type: string
        default: .
      release_name:
        type: string
        default: app
      namespace:
        type: string
        default: default
      minimum_kind_count:
        type: number
        default: 1
      forbid_ingress:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Lint chart
        run: helm lint "${{ inputs.chart_path }}"

      - name: Render chart
        run: helm template "${{ inputs.release_name }}" "${{ inputs.chart_path }}" --namespace "${{ inputs.namespace }}" > rendered.yaml

      - name: Validate rendered resource count
        shell: bash
        run: test "$(grep -c '^kind:' rendered.yaml)" -ge "${{ inputs.minimum_kind_count }}"

      - name: Validate ingress policy
        if: ${{ inputs.forbid_ingress }}
        run: '! grep -q "^kind: Ingress$" rendered.yaml'

      - name: Validate rendered manifest is non-empty
        shell: bash
        run: test -s rendered.yaml

      - name: Upload rendered manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rendered-helm-manifest
          path: rendered.yaml
